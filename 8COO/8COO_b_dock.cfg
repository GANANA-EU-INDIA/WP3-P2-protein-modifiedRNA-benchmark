# HADDOCK3 bound docking - 8COO
run_dir = "run_dock"
mode = "local"
ncores = 125

molecules = [
    "8COO_p_b.pdb",
    "8COO_r_b.pdb",
]

[topoaa]

[rigidbody]
ambig_fname = "8COO_b_ambig.tbl"
sampling = 10000
tolerance = 5

[seletop]
select = 400

[flexref]
ambig_fname = "8COO_b_ambig.tbl"

[emref]
ambig_fname = "8COO_b_ambig.tbl"

[clustfcc]

[seletopclusts]
top_models = 4

[caprieval]
reference_fname = "8COO_target.pdb"
