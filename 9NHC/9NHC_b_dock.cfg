# HADDOCK3 bound docking - 9NHC
run_dir = "run_dock"
mode = "local"
ncores = 125

molecules = [
    "9NHC_p_b.pdb",
    "9NHC_r_b.pdb",
]

[topoaa]

[rigidbody]
ambig_fname = "9NHC_b_ambig.tbl"
sampling = 10000
tolerance = 5

[seletop]
select = 400

[flexref]
ambig_fname = "9NHC_b_ambig.tbl"

[emref]
ambig_fname = "9NHC_b_ambig.tbl"

[clustfcc]

[seletopclusts]
top_models = 4

[caprieval]
reference_fname = "9NHC_target.pdb"
