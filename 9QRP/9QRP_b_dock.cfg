# HADDOCK3 bound docking - 9QRP
run_dir = "run_dock"
mode = "local"
ncores = 125

molecules = [
    "9QRP_p_b.pdb",
    "9QRP_r_b.pdb",
]

[topoaa]

[rigidbody]
ambig_fname = "9QRP_b_ambig.tbl"
sampling = 10000
tolerance = 5

[seletop]
select = 400

[flexref]
ambig_fname = "9QRP_b_ambig.tbl"

[emref]
ambig_fname = "9QRP_b_ambig.tbl"

[clustfcc]

[seletopclusts]
top_models = 4

[caprieval]
reference_fname = "9QRP_target.pdb"
