# HADDOCK3 bound docking - 5CCX
run_dir = "run_dock"
mode = "local"
ncores = 125

molecules = [
    "5CCX_p_b.pdb",
    "5CCX_r_b.pdb",
]

[topoaa]

[rigidbody]
ambig_fname = "5CCX_b_ambig.tbl"
sampling = 10000
tolerance = 5

[seletop]
select = 400

[flexref]
ambig_fname = "5CCX_b_ambig.tbl"

[emref]
ambig_fname = "5CCX_b_ambig.tbl"

[clustfcc]

[seletopclusts]
top_models = 4

[caprieval]
reference_fname = "5CCX_target.pdb"
