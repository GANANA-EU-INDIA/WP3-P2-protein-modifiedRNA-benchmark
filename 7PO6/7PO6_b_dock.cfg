# HADDOCK3 bound docking - 7PO6
run_dir = "run_dock"
mode = "local"
ncores = 125

molecules = [
    "7PO6_p_b.pdb",
    "7PO6_r_b.pdb",
]

[topoaa]

[rigidbody]
ambig_fname = "7PO6_b_ambig.tbl"
sampling = 10000
tolerance = 5

[seletop]
select = 400

[flexref]
ambig_fname = "7PO6_b_ambig.tbl"

[emref]
ambig_fname = "7PO6_b_ambig.tbl"

[clustfcc]

[seletopclusts]
top_models = 4

[caprieval]
reference_fname = "7PO6_target.pdb"
