# HADDOCK3 bound docking - 2MTV
run_dir = "run_dock"
mode = "local"
ncores = 125

molecules = [
    "2MTV_p_b.pdb",
    "2MTV_r_b.pdb",
]

[topoaa]

[rigidbody]
ambig_fname = "2MTV_b_ambig.tbl"
sampling = 10000
tolerance = 5

[seletop]
select = 400

[flexref]
ambig_fname = "2MTV_b_ambig.tbl"

[emref]
ambig_fname = "2MTV_b_ambig.tbl"

[clustfcc]

[seletopclusts]
top_models = 4

[caprieval]
reference_fname = "2MTV_target.pdb"
